name: no-secrets

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  no-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: no cleartext passwords/secrets
        run: python3 tools/checks/no_secrets.py
      - name: no_secrets checker tests
        run: python3 -m unittest discover -s tools/checks/tests -p "test_no_secrets.py" -v
